[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub-sdk"
version = "0.1.0"
description = "AgentHub SDK - pull evaluation datasets from your AgentHub server"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["agenthub_sdk*"]
