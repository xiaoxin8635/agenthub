# 前端容器：静态资源 + API 反向代理
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（compose 网络）
    location /api/ {
        proxy_pass http://backend:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
    }
}
